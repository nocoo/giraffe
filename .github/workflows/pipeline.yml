name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      runtime-version: "1.4.0"
      install-policy: project
      artifact-name: b1-dist
      artifact-path: dist/client
      d1-migrations: true
      d1-databases: giraffe-db
      deploy-script: "bun run scripts/deploy-worker.ts"
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        HTTP=$(curl -fsS -o /tmp/live.json -w "%{http_code}" https://giraffe.hexly.ai/api/live || echo "000")
        ACTUAL=$(jq -r .version /tmp/live.json 2>/dev/null || echo "?")
        test "$HTTP" = "200" && test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
